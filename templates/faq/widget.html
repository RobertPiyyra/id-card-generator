<style>
/* FAQ Chat Widget */
.faq-widget-trigger {
    position: fixed;
    bottom: 24px;
    right: 24px;
    width: 56px;
    height: 56px;
    border-radius: 50%;
    background: #2563eb;
    color: #fff;
    border: none;
    cursor: pointer;
    box-shadow: 0 4px 16px rgba(37, 99, 235, 0.4);
    z-index: 9999;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.4rem;
    transition: transform 0.2s, box-shadow 0.2s;
}
.faq-widget-trigger:hover {
    transform: scale(1.08);
    box-shadow: 0 6px 24px rgba(37, 99, 235, 0.5);
}
.faq-widget-panel {
    position: fixed;
    bottom: 90px;
    right: 24px;
    width: 380px;
    max-height: 520px;
    background: #fff;
    border-radius: 16px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.15);
    z-index: 9999;
    display: none;
    flex-direction: column;
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
}
.faq-widget-panel.open { display: flex; }
.faq-widget-header {
    background: #2563eb;
    color: #fff;
    padding: 16px 20px;
    font-weight: 600;
    font-size: 1rem;
    display: flex;
    justify-content: space-between;
    align-items: center;
}
.faq-widget-close {
    background: none;
    border: none;
    color: #fff;
    font-size: 1.2rem;
    cursor: pointer;
    opacity: 0.8;
}
.faq-widget-close:hover { opacity: 1; }
.faq-widget-messages {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 10px;
}
.faq-msg {
    max-width: 85%;
    padding: 10px 14px;
    border-radius: 12px;
    font-size: 0.9rem;
    line-height: 1.5;
    word-wrap: break-word;
}
.faq-msg-bot {
    background: #f1f5f9;
    color: #1e293b;
    align-self: flex-start;
    border-bottom-left-radius: 4px;
}
.faq-msg-user {
    background: #2563eb;
    color: #fff;
    align-self: flex-end;
    border-bottom-right-radius: 4px;
}
.faq-msg-category {
    font-size: 0.75rem;
    color: #64748b;
    margin-bottom: 4px;
    font-weight: 500;
}
.faq-widget-input-area {
    padding: 12px 16px;
    border-top: 1px solid #e2e8f0;
    display: flex;
    gap: 8px;
}
.faq-widget-input {
    flex: 1;
    padding: 10px 14px;
    border: 1px solid #e2e8f0;
    border-radius: 8px;
    font-size: 0.9rem;
    outline: none;
}
.faq-widget-input:focus { border-color: #2563eb; }
.faq-widget-send {
    padding: 10px 16px;
    background: #2563eb;
    color: #fff;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    font-weight: 500;
    font-size: 0.85rem;
}
.faq-widget-send:hover { background: #1d4ed8; }
.faq-widget-send:disabled { background: #94a3b8; cursor: not-allowed; }
.faq-quick-questions {
    padding: 8px 16px;
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    border-top: 1px solid #f1f5f9;
}
.faq-quick-btn {
    padding: 6px 12px;
    background: #f1f5f9;
    border: 1px solid #e2e8f0;
    border-radius: 16px;
    font-size: 0.78rem;
    cursor: pointer;
    color: #475569;
    transition: background 0.15s;
}
.faq-quick-btn:hover { background: #e2e8f0; }
</style>

<button class="faq-widget-trigger" id="faqWidgetTrigger" title="Ask a question">
    <svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
</button>

<div class="faq-widget-panel" id="faqWidgetPanel">
    <div class="faq-widget-header">
        <span>Help &amp; FAQ</span>
        <button class="faq-widget-close" id="faqWidgetClose">&times;</button>
    </div>
    <div class="faq-widget-messages" id="faqMessages">
        <div class="faq-msg faq-msg-bot">
            Hi! I can help you with questions about uploading photos, generating ID cards, templates, QR codes, printing, and more. What would you like to know?
        </div>
    </div>
    <div class="faq-quick-questions">
        <button class="faq-quick-btn" onclick="faqAsk('How do I upload photos?')">Upload photos</button>
        <button class="faq-quick-btn" onclick="faqAsk('How do I generate ID cards?')">Generate cards</button>
        <button class="faq-quick-btn" onclick="faqAsk('How do QR codes work?')">QR codes</button>
        <button class="faq-quick-btn" onclick="faqAsk('Does this support Urdu?')">Urdu support</button>
    </div>
    <div class="faq-widget-input-area">
        <input type="text" class="faq-widget-input" id="faqInput" placeholder="Type your question..." onkeydown="if(event.key==='Enter')faqAsk()">
        <button class="faq-widget-send" id="faqSend" onclick="faqAsk()">Send</button>
    </div>
</div>

<script>
(function() {
    const trigger = document.getElementById('faqWidgetTrigger');
    const panel = document.getElementById('faqWidgetPanel');
    const closeBtn = document.getElementById('faqWidgetClose');
    const messages = document.getElementById('faqMessages');
    const input = document.getElementById('faqInput');
    const sendBtn = document.getElementById('faqSend');

    trigger.addEventListener('click', function() {
        panel.classList.toggle('open');
        if (panel.classList.contains('open')) input.focus();
    });
    closeBtn.addEventListener('click', function() {
        panel.classList.remove('open');
    });

    window.faqAsk = function(text) {
        if (text === undefined || text === null) {
            text = input.value.trim();
        }
        if (!text) return;

        // Add user message
        const userMsg = document.createElement('div');
        userMsg.className = 'faq-msg faq-msg-user';
        userMsg.textContent = text;
        messages.appendChild(userMsg);
        input.value = '';
        messages.scrollTop = messages.scrollHeight;

        // Disable send
        sendBtn.disabled = true;

        // Call FAQ API
        fetch('/api/faq', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({question: text}),
        })
        .then(r => r.json())
        .then(data => {
            const botMsg = document.createElement('div');
            botMsg.className = 'faq-msg faq-msg-bot';

            if (data.matched && data.category) {
                const cat = document.createElement('div');
                cat.className = 'faq-msg-category';
                cat.textContent = data.category;
                botMsg.appendChild(cat);
            }

            const ans = document.createElement('div');
            ans.textContent = data.answer;
            botMsg.appendChild(ans);

            messages.appendChild(botMsg);
            messages.scrollTop = messages.scrollHeight;
        })
        .catch(function() {
            const errMsg = document.createElement('div');
            errMsg.className = 'faq-msg faq-msg-bot';
            errMsg.textContent = "Sorry, something went wrong. Please try again or visit the full FAQ page.";
            messages.appendChild(errMsg);
        })
        .finally(function() {
            sendBtn.disabled = false;
            input.focus();
        });
    };
})();
</script>
